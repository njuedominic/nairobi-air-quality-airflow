<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nairobi Air Quality</title>

    <link href="https://api.mapbox.com/mapbox-gl-js/v3.30.0/mapbox-gl.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.30.0/mapbox-gl.js"></script>
</head>

<body>
    <div id="legend">
        <h4>PM2.5</h4>
        <div id="legend-items"></div>
    </div>

    <div id="controls">
        <label for="parameter-select">Parameter</label>
        <select id="parameter-select">
            <option value="pm25">PM2.5</option>
            <option value="pm1">PM1</option>
            <option value="temperature">Temperature</option>
            <option value="relativehumidity">Relative Humidity</option>
            <option value="pm10">PM10</option>
            <option value="no2">NO2</option>
            <option value="o3">O3</option>
            <option value="co">CO</option>
        </select>
    </div>

    <div id="map"></div>

    <script type="module" src="app.js"></script>
</body>

</html>
